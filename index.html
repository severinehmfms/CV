<html>
<head>
    <title>CV - Séverine TEST</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- On va mettre ici les blocs pour mon CV et on va essayer de récupérer le contenu du JSON -->
    <header class="style-flex">
        <div class = "bande-gauche">        
            <div class = "photo">
                <img src="img/image.webp"/>
            </div>
        </div>
        <div class = "bande-droite">     
            <div class="identite">
                <div>
                    <h1 id="nom"></h1>
                    <p id="titre"></p>
                </div>
                <!-- <img src="img/mail.png" class="icone-contact">-->                          
                <button class="bouton-contact" data-cible="contact">
                    ✉ Me contacter
                </button>
            </div>
            
                <div id="contact" class="contact panneau-menu">
                    <div class="contact-infos">
                        <p id="email"></p>
                        <p id="phone"></p>
                        <p id="ville"></p>
                    </div>
                </div>

            <nav class="navigation">
            <button data-cible="description" class="actif">Présentation</button>
            <button data-cible="experiences">Expériences</button>
            <button data-cible="formations">Formations</button>
            <button data-cible="projets">Projets</button>
            </nav>
        </div>
    </header>

    <main class = "style-flex">
        <aside>            
            <section id="section-competences">
                <h2>
                    Compétences
                    <span id="bouton-competences" class="classe-bouton">-</span>
                </h2>
                <div id="competences" class="visible"></div>
            </section>
            <section id="section-langues">
                <h2>
                    Langues
                    <span id="bouton-langues" class="classe-bouton">-</span>
                </h2>
                <div id="langues" class="visible"></div>
            </section>
            <section id="section-interets">
                <h2>
                    Centres d'intérêts
                    <span id="bouton-interets" class="classe-bouton">-</span>
                </h2>
                <div id="interets" class="visible blocElementsVerticaux"></div>
            </section>    
        </aside>       

        <div class="bande-droite">
            <section id="section-description">
                <div class="titre-section">
                    <h2>Présentation</h2>
                </div>
                <div id="description" class="panneau-menu actif"></div>
            </section>

            <section id="section-experiences">
                <div class="titre-section">
                    <h2>Expériences</h2>
                </div>
                <div id="experiences" class="panneau-menu"></div>
            </section>

            <section id="section-formations">
                <div class="titre-section">
                    <h2>Formations</h2>
                </div>
                <div id="formations" class="panneau-menu"></div>            
            </section>            
            
            <section id="section-projets">
                <div class="titre-section">
                    <h2>Projets</h2>
                </div>                
                <div id="projets" class="panneau-menu"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 Séverine TEST</p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
