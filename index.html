<html>
<head>
    <title>CV - Séverine NOM</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <!-- On va mettre ici les blocs pour mon CV et on va essayer de récupérer le contenu du JSON -->
    <header class="style-flex">
        <div class = "bande-gauche">        
            <div class = "photo">
                <img src="img/image.webp"/>
            </div>
        </div>
        <div class = "bande-droite">     
            <div class="identite">
                <h1 id="nom"></h1>
                <p id="titre"></p>
            </div>
            <div class="contact">
                <p id="email"></p>
                <p id="phone"></p>
                <p id="ville"></p>
            </div>
        </div>
    </header>

    <main class = "style-flex">
        <aside>            
            <section id="section-competences">
                <h2>Compétences</h2>
                <div id="competences"></div>
            </section>
            <section id="section-langues">
                <h2>Langues</h2>
                <div id="langues"></div>
            </section>
            <section id="section-interets">
                <h2>Centres d'intérêts</h2>
                <div id="interets" class="blocElements"></div>
            </section>    
        </aside>       

        <div class="bande-droite">
            <section id="section-description">
                <div class="titre-section">
                    <h2>Présentation</h2>
                </div>
                <div id="description"></div>
            </section>

            <section id="section-formations">
                <div class="titre-section">
                    <h2>Formations <span id="bouton-formations" class="classe-bouton">-</span></h2>
                </div>
                <div id="formations" class="visible"></div>            
            </section>

            <section id="section-experiences">
                <div class="titre-section">
                    <h2>Expériences <span id="bouton-experiences" class="classe-bouton">-</span></h2>
                </div>
                <div id="experiences" class="visible"></div>
            </section>
            
            <section id="section-projets">
                <div class="titre-section">
                    <h2>Projets <span id="bouton-projets" class="classe-bouton">-</span></h2>
                </div>                
                <div id="projets" class="visible"></div>
            </section>
        </div>
    </main>

    <footer>
        <p>© 2026 Séverine HM</p>
    </footer>
    <script src="js/script.js"></script>
</body>

</html>
