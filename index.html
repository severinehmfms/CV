<html>
<head>

</head>

                <img src="image.webp"/>
            </div>
        </div>
        <div class = "bande-droite">     
            <div class="identite">

    <main class = "style-flex">

            </section>
            <section id="section-interets">

            </section>    
        </aside>       

        <div class="bande-droite">
            <section id="section-formations">
                <h2>Formations</h2>
                <div id="formations"></div>            
            </section>
            <section id="section-experiences">
                <h2>Expériences</h2>
                <div id="experiences"></div>
            </section>
            <section id="section-projets">
                <h2>Projets</h2>
                <div id="projets"></div>
            </section>
        </div>  

    </main>

    <footer>
        <p>© 2026 Séverine HM</p>
    </footer>
    <script src="js/script.js"></script>

</html>
